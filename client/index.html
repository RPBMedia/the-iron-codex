<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <!-- 771 of the 800 articles load their main image from Wikimedia Commons, so
         the TLS handshake to these two hosts is on the critical path for almost
         every article page. Warming it early is the single cheapest win available
         on largest-contentful-paint. -->
    <link rel="preconnect" href="https://commons.wikimedia.org" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link rel="dns-prefetch" href="https://commons.wikimedia.org" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=shield-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=shield-1" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png?v=shield-1" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=shield-1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=shield-1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=shield-1" />
    <link rel="icon" href="/favicon.ico?v=shield-1" />
    <link rel="manifest" href="/site.webmanifest?v=shield-1" />
    <title>The Iron Codex</title>
  </head>
